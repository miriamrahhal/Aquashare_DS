# Stateless gateways: a Deployment with 2 replicas behind a Service, which load-balances
# between them (it replaces Nginx). Reachable from Windows at http://localhost:30600.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: aquashare-gateway:k8s
          imagePullPolicy: Never
          ports: [ { containerPort: 8000 } ]
          env:
            - name: GATEWAY_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # the pod name, shown in every answer
            - name: LEDGER_NODES
              value: ledger-0=http://ledger-0.ledger:8000,ledger-1=http://ledger-1.ledger:8000,ledger-2=http://ledger-2.ledger:8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { port: 8000, targetPort: 8000, nodePort: 30600 }
