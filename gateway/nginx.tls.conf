# Load balancer with mutual TLS (used by docker-compose.tls.yml).
# Clients (the farms, the dashboard, your scripts) must show a certificate signed by the
# AquaShare CA, and Nginx shows its own certificate to the gateways behind it.
events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateways {
        zone gateways 64k;
        server gateway-1:8000 max_fails=1 fail_timeout=5s resolve;
        server gateway-2:8000 max_fails=1 fail_timeout=5s resolve;
    }

    server {
        listen 80 ssl;
        ssl_certificate        /certs/gateway-lb.crt;
        ssl_certificate_key    /certs/gateway-lb.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      on;

        location / {
            proxy_pass https://gateways;
            proxy_ssl_certificate         /certs/gateway-lb.crt;
            proxy_ssl_certificate_key     /certs/gateway-lb.key;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify              on;
            proxy_ssl_name                gateway;     # both gateway certificates carry this name
            proxy_ssl_session_reuse       on;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout non_idempotent;
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}
