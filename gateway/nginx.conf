# Load balancer in front of the two stateless gateways.
events {}

http {
    # Docker's internal DNS. Gateways get a new IP when they restart, so the
    # addresses are looked up again every 5 seconds instead of only at start-up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateways {
        zone gateways 64k;
        server gateway-1:8000 max_fails=1 fail_timeout=5s resolve;
        server gateway-2:8000 max_fails=1 fail_timeout=5s resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateways;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            # If a gateway is down, try the other one. Safe for POST requests too,
            # because every command carries a cmd_id that the ledger applies only once.
            proxy_next_upstream error timeout non_idempotent;
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}