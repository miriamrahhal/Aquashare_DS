x-farm: &farm
  build:
    context: .
    dockerfile: farm_node/Dockerfile
  restart: unless-stopped

x-ledger-db: &ledger-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: ledger
    POSTGRES_USER: aquashare
    POSTGRES_PASSWORD: aquashare_dev
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aquashare -d ledger"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

x-ledger: &ledger
  build:
    context: .
    dockerfile: ledger_node/Dockerfile
  restart: "no"

x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  restart: "no"
  depends_on: [ledger-1, ledger-2, ledger-3]

services:
  gateway-1:
    <<: *gateway
    container_name: aq-gateway-1
    environment:
      GATEWAY_ID: gateway-1
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8601:8000" ]

  gateway-2:
    <<: *gateway
    container_name: aq-gateway-2
    environment:
      GATEWAY_ID: gateway-2
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8602:8000" ]

  gateway-lb:
    image: nginx:1.27.5-alpine
    container_name: aq-gateway-lb
    restart: "no"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: [ "8600:80" ]
    depends_on: [ gateway-1, gateway-2 ]

  ledger-db-1:
    <<: *ledger-db
    container_name: aq-ledger-db-1
    ports:
      - "5441:5432"
    volumes:
      - ledger-db-1:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-2:
    <<: *ledger-db
    container_name: aq-ledger-db-2
    ports:
      - "5442:5432"
    volumes:
      - ledger-db-2:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-3:
    <<: *ledger-db
    container_name: aq-ledger-db-3
    ports:
      - "5443:5432"
    volumes:
      - ledger-db-3:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aq-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  farm-a:
    <<: *farm
    container_name: aq-farm-a
    environment: { FARM_ID: farm-a, INITIAL_QUOTA_L: "20000" }
    ports: [ "8801:8000" ]
    volumes: [ "farm-a-data:/data" ]

  farm-b:
    <<: *farm
    container_name: aq-farm-b
    environment: { FARM_ID: farm-b, INITIAL_QUOTA_L: "20000" }
    ports: [ "8802:8000" ]
    volumes: [ "farm-b-data:/data" ]

  farm-c:
    <<: *farm
    container_name: aq-farm-c
    environment: { FARM_ID: farm-c, INITIAL_QUOTA_L: "20000" }
    ports: [ "8803:8000" ]
    volumes: [ "farm-c-data:/data" ]

  farm-d:
    <<: *farm
    container_name: aq-farm-d
    environment: { FARM_ID: farm-d, INITIAL_QUOTA_L: "20000" }
    ports: [ "8804:8000" ]
    volumes: [ "farm-d-data:/data" ]

  ledger-1:
    <<: *ledger
    container_name: aq-ledger-1
    environment:
      NODE_ID: ledger-1
      PEERS: ledger-2=ledger-2:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-1:5432/ledger
    depends_on:
      ledger-db-1:
        condition: service_healthy
    ports: ["8701:8000"]

  ledger-2:
    <<: *ledger
    container_name: aq-ledger-2
    environment:
      NODE_ID: ledger-2
      PEERS: ledger-1=ledger-1:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-2:5432/ledger
    depends_on:
      ledger-db-2:
        condition: service_healthy
    ports: [ "8702:8000" ]

  ledger-3:
    <<: *ledger
    container_name: aq-ledger-3
    environment:
      NODE_ID: ledger-3
      PEERS: ledger-1=ledger-1:50051,ledger-2=ledger-2:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-3:5432/ledger
    depends_on:
      ledger-db-3:
        condition: service_healthy
    ports: [ "8703:8000" ]

volumes:
  ledger-db-1:
  ledger-db-2:
  ledger-db-3:
  rabbitmq-data:
  farm-a-data:
  farm-b-data:
  farm-c-data:
  farm-d-data: