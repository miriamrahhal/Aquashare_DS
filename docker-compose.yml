x-farm: &farm
  build:
    context: .
    dockerfile: farm_node/Dockerfile
  restart: unless-stopped

x-ledger-db: &ledger-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: ledger
    POSTGRES_USER: aquashare
    POSTGRES_PASSWORD: aquashare_dev
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aquashare -d ledger"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

x-ledger: &ledger
  build:
    context: .
    dockerfile: ledger_node/Dockerfile
  restart: "no"

x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  restart: "no"
  depends_on: [ledger-1, ledger-2, ledger-3]

x-analytics: &analytics
  build:
    context: .
    dockerfile: analytics/Dockerfile
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  gateway-1:
    <<: *gateway
    container_name: aq-gateway-1
    environment:
      GATEWAY_ID: gateway-1
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8601:8000" ]

  gateway-2:
    <<: *gateway
    container_name: aq-gateway-2
    environment:
      GATEWAY_ID: gateway-2
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8602:8000" ]

  gateway-lb:
    image: nginx:1.27.5-alpine
    container_name: aq-gateway-lb
    restart: "no"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: [ "8600:80" ]
    depends_on: [ gateway-1, gateway-2 ]

  ledger-db-1:
    <<: *ledger-db
    container_name: aq-ledger-db-1
    networks: [ ledger-1-db ]
    ports:
      - "5441:5432"
    volumes:
      - ledger-db-1:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-2:
    <<: *ledger-db
    container_name: aq-ledger-db-2
    networks: [ ledger-2-db ]
    ports:
      - "5442:5432"
    volumes:
      - ledger-db-2:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-3:
    <<: *ledger-db
    container_name: aq-ledger-db-3
    networks: [ ledger-3-db ]
    ports:
      - "5443:5432"
    volumes:
      - ledger-db-3:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aquashare
      RABBITMQ_DEFAULT_PASS: aquashare_dev
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  farm-a:
    <<: *farm
    container_name: aq-farm-a
    environment: { FARM_ID: farm-a,  GATEWAY_URL: http://gateway-lb }
    ports: [ "8801:8000" ]
    volumes: [ "farm-a-data:/data" ]

  farm-b:
    <<: *farm
    container_name: aq-farm-b
    environment: { FARM_ID: farm-b, GATEWAY_URL: http://gateway-lb }
    ports: [ "8802:8000" ]
    volumes: [ "farm-b-data:/data" ]

  farm-c:
    <<: *farm
    container_name: aq-farm-c
    environment: { FARM_ID: farm-c, GATEWAY_URL: http://gateway-lb }
    ports: [ "8803:8000" ]
    volumes: [ "farm-c-data:/data" ]

  farm-d:
    <<: *farm
    container_name: aq-farm-d
    environment: { FARM_ID: farm-d, GATEWAY_URL: http://gateway-lb }
    ports: [ "8804:8000" ]
    volumes: [ "farm-d-data:/data" ]

  ledger-1:
    <<: *ledger
    container_name: aq-ledger-1
    networks: [ default, ledger-1-db ]
    environment:
      NODE_ID: ledger-1
      PEERS: ledger-2=ledger-2:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-1:5432/ledger
    depends_on:
      ledger-db-1:
        condition: service_healthy
    ports: ["8701:8000"]

  ledger-2:
    <<: *ledger
    container_name: aq-ledger-2
    networks: [ default, ledger-2-db ]
    environment:
      NODE_ID: ledger-2
      PEERS: ledger-1=ledger-1:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-2:5432/ledger
    depends_on:
      ledger-db-2:
        condition: service_healthy
    ports: [ "8702:8000" ]

  ledger-3:
    <<: *ledger
    container_name: aq-ledger-3
    networks: [ default, ledger-3-db ]
    environment:
      NODE_ID: ledger-3
      PEERS: ledger-1=ledger-1:50051,ledger-2=ledger-2:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-3:5432/ledger
    depends_on:
      ledger-db-3:
        condition: service_healthy
    ports: [ "8703:8000" ]

  event-relay:
    <<: *analytics
    container_name: aq-event-relay
    command: ["python", "-m", "analytics.relay"]
    environment:
      RABBITMQ_URL: amqp://aquashare:aquashare_dev@rabbitmq:5672/%2F
      LEDGER_NODES: http://ledger-1:8000,http://ledger-2:8000,http://ledger-3:8000
    volumes: [ "relay-data:/data" ]

  analytics:
    <<: *analytics
    container_name: aq-analytics
    environment:
      RABBITMQ_URL: amqp://aquashare:aquashare_dev@rabbitmq:5672/%2F
    ports: [ "8901:8000" ]
    volumes: [ "analytics-data:/data" ]

volumes:
  ledger-db-1:
  ledger-db-2:
  ledger-db-3:
  rabbitmq-data:
  farm-a-data:
  farm-b-data:
  farm-c-data:
  farm-d-data:
  relay-data:
  analytics-data:

# Each ledger node reaches its own database over a private network, so cutting a node
# off the cluster network (a partition) does not also cut it off from its database.
networks:
  default:
  ledger-1-db:
  ledger-2-db:
  ledger-3-db:
