x-farm: &farm
  build:
    context: .
    dockerfile: farm_node/Dockerfile
  restart: unless-stopped

x-ledger-db: &ledger-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: ledger
    POSTGRES_USER: aquashare
    POSTGRES_PASSWORD: aquashare_dev
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aquashare -d ledger"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

x-ledger: &ledger
  build:
    context: .
    dockerfile: ledger_node/Dockerfile
  # A crashed node is restarted by Docker and catches up from the leader (Raft).
  # A node stopped on purpose (docker stop, the demo, the tests) stays stopped.
  restart: unless-stopped

x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  restart: unless-stopped
  depends_on: [ledger-1, ledger-2, ledger-3]

x-analytics: &analytics
  build:
    context: .
    dockerfile: analytics/Dockerfile
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  gateway-1:
    <<: *gateway
    container_name: aq-gateway-1
    environment:
      GATEWAY_ID: gateway-1
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8601:8000" ]

  gateway-2:
    <<: *gateway
    container_name: aq-gateway-2
    environment:
      GATEWAY_ID: gateway-2
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
    ports: [ "8602:8000" ]

  gateway-lb:
    image: nginx:1.27.5-alpine
    container_name: aq-gateway-lb
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: [ "8600:80" ]
    depends_on: [ gateway-1, gateway-2 ]

  ledger-db-1:
    <<: *ledger-db
    container_name: aq-ledger-db-1
    networks: [ ledger-1-db ]
    ports:
      - "5441:5432"
    volumes:
      - ledger-db-1:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-2:
    <<: *ledger-db
    container_name: aq-ledger-db-2
    networks: [ ledger-2-db ]
    ports:
      - "5442:5432"
    volumes:
      - ledger-db-2:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ledger-db-3:
    <<: *ledger-db
    container_name: aq-ledger-db-3
    networks: [ ledger-3-db ]
    ports:
      - "5443:5432"
    volumes:
      - ledger-db-3:/var/lib/postgresql/data
      - ./ledger_node/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: aquashare
      RABBITMQ_DEFAULT_PASS: aquashare_dev
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  farm-a:
    <<: *farm
    container_name: aq-farm-a
    environment: { FARM_ID: farm-a, GATEWAY_URL: http://gateway-lb, TICK_SECONDS: "${TICK_SECONDS:-3}", FLOW_L_PER_TICK: "${FLOW_L_PER_TICK:-8}" }
    ports: [ "8801:8000" ]
    volumes: [ "farm-a-data:/data" ]

  farm-b:
    <<: *farm
    container_name: aq-farm-b
    environment: { FARM_ID: farm-b, GATEWAY_URL: http://gateway-lb, TICK_SECONDS: "${TICK_SECONDS:-3}", FLOW_L_PER_TICK: "${FLOW_L_PER_TICK:-8}" }
    ports: [ "8802:8000" ]
    volumes: [ "farm-b-data:/data" ]

  farm-c:
    <<: *farm
    container_name: aq-farm-c
    environment: { FARM_ID: farm-c, GATEWAY_URL: http://gateway-lb, TICK_SECONDS: "${TICK_SECONDS:-3}", FLOW_L_PER_TICK: "${FLOW_L_PER_TICK:-9}" }
    ports: [ "8803:8000" ]
    volumes: [ "farm-c-data:/data" ]

  farm-d:
    <<: *farm
    container_name: aq-farm-d
    environment: { FARM_ID: farm-d, GATEWAY_URL: http://gateway-lb, TICK_SECONDS: "${TICK_SECONDS:-3}", FLOW_L_PER_TICK: "${FLOW_L_PER_TICK:-10}" }
    ports: [ "8804:8000" ]
    volumes: [ "farm-d-data:/data" ]

  ledger-1:
    <<: *ledger
    container_name: aq-ledger-1
    networks: [ default, ledger-1-db ]
    environment:
      NODE_ID: ledger-1
      PEERS: ledger-2=ledger-2:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-1:5432/ledger
    depends_on:
      ledger-db-1:
        condition: service_healthy
    ports: ["8701:8000"]

  ledger-2:
    <<: *ledger
    container_name: aq-ledger-2
    networks: [ default, ledger-2-db ]
    environment:
      NODE_ID: ledger-2
      PEERS: ledger-1=ledger-1:50051,ledger-3=ledger-3:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-3=http://ledger-3:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-2:5432/ledger
    depends_on:
      ledger-db-2:
        condition: service_healthy
    ports: [ "8702:8000" ]

  ledger-3:
    <<: *ledger
    container_name: aq-ledger-3
    networks: [ default, ledger-3-db ]
    environment:
      NODE_ID: ledger-3
      PEERS: ledger-1=ledger-1:50051,ledger-2=ledger-2:50051
      HTTP_PEERS: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000
      DATABASE_URL: postgresql://aquashare:aquashare_dev@ledger-db-3:5432/ledger
    depends_on:
      ledger-db-3:
        condition: service_healthy
    ports: [ "8703:8000" ]

  event-relay:
    <<: *analytics
    container_name: aq-event-relay
    command: ["python", "-m", "analytics.relay"]
    environment:
      RABBITMQ_URL: amqp://aquashare:aquashare_dev@rabbitmq:5672/%2F
      LEDGER_NODES: http://ledger-1:8000,http://ledger-2:8000,http://ledger-3:8000
    volumes: [ "relay-data:/data" ]

  analytics:
    <<: *analytics
    container_name: aq-analytics
    environment:
      RABBITMQ_URL: amqp://aquashare:aquashare_dev@rabbitmq:5672/%2F
    ports: [ "8901:8000" ]
    volumes: [ "analytics-data:/data" ]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aq-prometheus
    volumes: [ "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    ports: [ "9095:9090" ]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: aq-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aquashare
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aquashare.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: [ "3300:3000" ]
    depends_on: [ prometheus ]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aq-dashboard
    environment:
      GATEWAY_URL: http://gateway-lb
      LEDGER_NODES: ledger-1=http://ledger-1:8000,ledger-2=http://ledger-2:8000,ledger-3=http://ledger-3:8000
      FARM_NODES: farm-a=http://farm-a:8000,farm-b=http://farm-b:8000,farm-c=http://farm-c:8000,farm-d=http://farm-d:8000
      ANALYTICS_URL: http://analytics:8000
      LEDGER_DSNS: postgresql://aquashare:aquashare_dev@ledger-db-1:5432/ledger,postgresql://aquashare:aquashare_dev@ledger-db-2:5432/ledger,postgresql://aquashare:aquashare_dev@ledger-db-3:5432/ledger
    # the DB networks let the "Check the rules" scenario read the 3 databases (read-only checks)
    networks: [ default, ledger-1-db, ledger-2-db, ledger-3-db ]
    volumes:
      - ./results:/app/results:ro
      # DEMO ONLY: lets the dashboard stop/start ledger containers (scenarios 1 and 2).
      # This gives it full control of Docker; never do this in production.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: [ "8090:8000" ]
    depends_on: [ gateway-lb ]
    restart: unless-stopped

  # Batch analytics with Apache Spark (not started by "up"; run it on demand):
  #   docker compose run --rm spark
  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    profiles: [ "spark" ]
    user: root
    working_dir: /app
    volumes:
      - ./spark:/app/spark
    entrypoint: [ "/opt/spark/bin/spark-submit", "--master", "local[*]" ]
    command: [ "/app/spark/water_report.py", "/app/spark/data", "/app/spark/output" ]

volumes:
  ledger-db-1:
  ledger-db-2:
  ledger-db-3:
  rabbitmq-data:
  farm-a-data:
  farm-b-data:
  farm-c-data:
  farm-d-data:
  relay-data:
  analytics-data:

# Each ledger node reaches its own database over a private network, so cutting a node
# off the cluster network (a partition) does not also cut it off from its database.
networks:
  default:
  ledger-1-db:
  ledger-2-db:
  ledger-3-db:
